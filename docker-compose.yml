services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wreso
      MYSQL_USER: wreso
      MYSQL_PASSWORD: wreso
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwreso", "-pwreso"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: wreso
      DB_PASSWORD: wreso
      DB_NAME: wreso
      # Change this! e.g. `openssl rand -hex 32`
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    volumes:
      - media-data:/data

volumes:
  mysql-data:
  media-data:
